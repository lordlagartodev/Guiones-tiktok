<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Estudio TikTok</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --border: #2a2f3d;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #fe2c55;
      --accent-2: #25f4ee;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 16px; background: var(--bg); color: var(--text);
      max-width: 600px; margin-inline: auto; padding-bottom: 60px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;
    }
    h1 { font-size: 1.2rem; margin: 0; }
    .badge {
      font-size: 0.7rem; background: rgba(254, 44, 85, 0.15); color: var(--accent);
      border: 1px solid var(--accent); padding: 2px 8px; border-radius: 99px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: 14px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    select, textarea, input {
      width: 100%; background: #0f1115; color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px; font-size: 0.95rem; margin-bottom: 12px;
    }
    textarea { min-height: 85px; resize: vertical; }
    button.primary {
      width: 100%; background: linear-gradient(135deg, var(--accent), #d91b42);
      color: #fff; border: none; border-radius: 10px; padding: 13px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-box {
      white-space: pre-wrap; line-height: 1.55; font-size: 0.94rem;
      background: #0f1115; padding: 14px; border-radius: 10px; border: 1px solid var(--border);
    }
    .actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-sec {
      flex: 1; background: #232834; color: var(--text); border: 1px solid var(--border);
      padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .history-item {
      border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; font-size: 0.85rem;
    }
    .history-title { color: var(--accent-2); font-weight: 600; margin-bottom: 4px; }
    .status { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>🎬 Estudio TikTok</h1>
    <span class="badge">Maternidad & Lifestyle</span>
  </header>

  <div class="card">
    <label for="apiKeyInput">🔑 API Key de Gemini (se guarda solo en este teléfono)</label>
    <div style="display:flex; gap:8px; margin-bottom:4px;">
      <input type="password" id="apiKeyInput" placeholder="Pega tu clave AQ.Ab8R..." style="margin-bottom:0;" />
      <button class="btn-sec" style="flex:0 0 auto;" onclick="guardarKey()">Guardar</button>
    </div>
    <div id="keyStatus" style="font-size:0.75rem; color:var(--accent-2); margin-bottom:10px;"></div>

    <label for="formato">Formato del video</label>
    <select id="formato">
      <option value="Storytime corto (30-45 seg) con giro inesperado">Storytime corto (30-45 seg)</option>
      <option value="Desahogo real / Maternidad sin filtro (15-25 seg)">Maternidad real / Sin filtro (15-25 seg)</option>
      <option value="Tip práctico de mamá / Día a día (20-30 seg)">Tip práctico / Día a día (20-30 seg)</option>
      <option value="Video rápido con texto en pantalla y audio en tendencia (7-12 seg)">Video corto con texto en pantalla (7-12 seg)</option>
    </select>

    <label for="tono">Tono de voz</label>
    <select id="tono">
      <option value="Cercano, honesto y con un toque de humor cotidiano">Cercano, honesto y con humor</option>
      <option value="Emotivo, reflexivo y que genere identificación">Emotivo y reflexivo</option>
      <option value="Directo, sarcástico y divertido">Directo y divertido</option>
    </select>

    <label for="idea">¿Qué pasó hoy o de qué trata la idea?</label>
    <textarea id="idea" placeholder="Ej: Mi hija de 1 año vació todo el paquete de toallitas húmedas mientras fui al baño 30 segundos..."></textarea>

    <button id="btnGenerar" class="primary" onclick="generarGuion()">✨ Generar Guion Listo para Grabar</button>
    <div id="status" class="status"></div>
  </div>

  <div id="resultadoCard" class="card" style="display:none;">
    <label>Guion generado</label>
    <div id="resultado" class="result-box"></div>
    <div class="actions">
      <button class="btn-sec" onclick="copiarGuion()">📋 Copiar guion</button>
      <button class="btn-sec" onclick="generarVariante()">🔄 Otro gancho</button>
    </div>
  </div>

  <div class="card">
    <label>📂 Últimos guiones guardados (Offline)</label>
    <div id="historial"><span style="color:var(--muted); font-size:0.85rem;">Aún no has generado guiones.</span></div>
  </div>

  <script>
    window.onload = function() {
      const savedKey = localStorage.getItem("gemini_api_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
        document.getElementById("keyStatus").textContent = "✅ Clave guardada en este dispositivo.";
      }
      renderHistorial();
    };

    function guardarKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      if (!val) return alert("Pega una API Key válida.");
      localStorage.setItem("gemini_api_key", val);
      document.getElementById("keyStatus").textContent = "✅ Clave guardada en este dispositivo.";
    }

    async function llamarGeminiConRespaldo(prompt) {
      const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) throw new Error("Falta pegar y guardar tu API Key arriba.");

      const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
      const listRes = await fetch(listUrl);
      const listData = await listRes.json();

      if (listData.error) throw new Error("API Key: " + listData.error.message);

      const candidatos = (listData.models || [])
        .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
        .map(m => m.name)
        .filter(n => !n.includes("2.5") && !n.includes("2.0") && !n.includes("1.5") && !n.includes("embedding") && !n.includes("aqa"));

      const ordenados = [
        ...candidatos.filter(n => n.includes("lite")),
        ...candidatos.filter(n => n.includes("flash") && !n.includes("lite")),
        ...candidatos.filter(n => n.includes("pro")),
        ...candidatos.filter(n => !n.includes("lite") && !n.includes("flash") && !n.includes("pro"))
      ];

      let ultimoError = "Sin modelos activos.";

      for (const modelo of ordenados) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/${modelo}:generateContent?key=${apiKey}`;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          if (!data.error && data.candidates && data.candidates[0]) {
            return data.candidates[0].content.parts[0].text;
          }
          ultimoError = data.error ? data.error.message : "Respuesta vacía";
        } catch (e) {
          ultimoError = e.message;
        }
      }
      throw new Error(ultimoError);
    }

    async function generarGuion(soloGancho = false) {
      const idea = document.getElementById("idea").value.trim();
      const formato = document.getElementById("formato").value;
      const tono = document.getElementById("tono").value;
      const btn = document.getElementById("btnGenerar");
      const status = document.getElementById("status");

      if (!idea) return alert("Escribe primero una idea o anécdota corta.");

      btn.disabled = true;
      status.textContent = "Redactando guion y ganchos...";

      const instruccion = soloGancho
        ? `Dame 3 ganchos alternativos ultra llamativos (primeros 3 segundos) para este video de TikTok sobre maternidad/lifestyle: "${idea}". Formato: ${formato}. Tono: ${tono}.`
        : `Eres una estratega experta en crecimiento orgánico en TikTok para creadoras de maternidad real (bebé de 1 año), anécdotas personales y estilo de vida diario.
Crea un guion listo para grabar con iPhone sin ediciones complicadas a partir de esta idea: "${idea}".
Formato elegido: ${formato}.
Tono: ${tono}.

Entrega el resultado con esta estructura clara y directa (sin saludos ni relleno):
1. 🎯 GANCHO (0-3 seg): La frase exacta para decir mirando a cámara y detener el scroll.
2. 📝 TEXTO EN PANTALLA: Frase corta para poner fija arriba en TikTok.
3. 🗣️ GUION HABLADO: Lo que debe decir natural, fluido y con pausas marcadas.
4. 🎥 ACCIÓN / PLANO: Qué hacer mientras habla (ej. doblando ropa, tomando café, plano medio) para hacerlo dinámico en una sola toma.
5. 💬 CIERRE + CTA: Pregunta final para disparar comentarios de otras mamás.
6. 🏷️ DESCRIPCIÓN Y 4 HASHTAGS: Copy corto para la descripción.`;

      try {
        const texto = await llamarGeminiConRespaldo(instruccion);
        document.getElementById("resultado").textContent = texto;
        document.getElementById("resultadoCard").style.display = "block";
        status.textContent = "Listo.";
        guardarHistorial(idea, texto);
      } catch (err) {
        status.textContent = "❌ Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    function generarVariante() { generarGuion(true); }

    function copiarGuion() {
      navigator.clipboard.writeText(document.getElementById("resultado").textContent);
      document.getElementById("status").textContent = "✅ Guion copiado al portapapeles.";
    }

    function guardarHistorial(idea, texto) {
      let lista = JSON.parse(localStorage.getItem("guiones_tiktok") || "[]");
      lista.unshift({ fecha: new Date().toLocaleDateString(), idea, texto });
      lista = lista.slice(0, 8);
      localStorage.setItem("guiones_tiktok", JSON.stringify(lista));
      renderHistorial();
    }

    function renderHistorial() {
      const cont = document.getElementById("historial");
      const lista = JSON.parse(localStorage.getItem("guiones_tiktok") || "[]");
      if (!lista.length) return;
      cont.innerHTML = lista.map((item, idx) => `
        <div class="history-item">
          <div class="history-title">${item.fecha} — ${item.idea.slice(0, 45)}...</div>
          <button class="btn-sec" style="padding:6px 10px; font-size:0.78rem;" onclick="cargarHistorial(${idx})">Ver guion</button>
        </div>
      `).join("");
    }

    function cargarHistorial(idx) {
      const lista = JSON.parse(localStorage.getItem("guiones_tiktok") || "[]");
      if (lista[idx]) {
        document.getElementById("resultado").textContent = lista[idx].texto;
        document.getElementById("resultadoCard").style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }
  </script>
</body>
</html>
